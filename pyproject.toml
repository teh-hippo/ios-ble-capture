[project]
name = "ios-ble-capture"
version = "0.1.0"
description = "Vendor-neutral iOS Bluetooth capture and BLE protocol analysis tools"
readme = "README.md"
authors = [
    { name = "teh-hippo", email = "490309+teh-hippo@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "kaitaistruct==0.11",
]

[project.optional-dependencies]
ble = [
    "bleak>=0.21.0",
]
ios = [
    "defusedxml>=0.7.1",
    "pymobiledevice3>=10.7.4",
]
all = [
    "bleak>=0.21.0",
    "defusedxml>=0.7.1",
    "pymobiledevice3>=10.7.4",
]

[project.scripts]
ios-ble-capture = "ios_ble_capture.cli:main"

[project.urls]
Homepage = "https://github.com/teh-hippo/ios-ble-capture"
Issues = "https://github.com/teh-hippo/ios-ble-capture/issues"
Repository = "https://github.com/teh-hippo/ios-ble-capture"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "EM101",
    "EM102",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "S101"]
